<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusHub | Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="events">
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- ===== HEADER / NAVIGATION ===== -->
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-campus">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">CampusHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="events.html">Events</a></li>
            <li class="nav-item"><a class="nav-link" href="dining.html">Dining</a></li>
            <li class="nav-item"><a class="nav-link" href="map.html">Map</a></li>
          </ul>
          <button id="themeToggle" class="btn btn-outline-light btn-sm ms-md-3 mt-2 mt-md-0">Dark mode</button>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="container my-4">
    <h1>Campus Events</h1>

    <!-- ===== SEARCH + FILTER BAR ===== -->
    <section class="row g-2 mb-4">
      <div class="col-md-8">
        <label for="eventSearch" class="visually-hidden">Search events</label>
        <input id="eventSearch" type="search" class="form-control" placeholder="Search events by name...">
      </div>
      <div class="col-md-4">
        <label for="categoryFilter" class="visually-hidden">Filter by category</label>
        <select id="categoryFilter" class="form-select">
          <option value="all">All categories</option>
          <option value="Clubs">Clubs</option>
          <option value="Sports">Sports</option>
          <option value="Academic">Academic</option>
          <option value="Social">Social</option>
        </select>
      </div>
    </section>

    <div class="row g-4">
      <!-- ===== SIDEBAR: SAVED EVENTS ===== -->
      <aside class="col-lg-3">
        <div class="card p-3">
          <h2 class="h6">My saved events ★</h2>
          <ul id="savedList" class="small mb-0 ps-3"></ul>
          <!-- Calendar view is planned for the final version -->
          <p class="small text-muted mt-2 mb-0">Calendar view coming soon.</p>
        </div>
      </aside>

      <!-- ===== EVENT CARDS (built by JavaScript from the events array) ===== -->
      <section class="col-lg-9">
        <div id="eventGrid" class="row g-3"></div>
        <p id="noResults" class="text-muted d-none">No events match your search.</p>
      </section>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-campus text-white text-center py-3 mt-4">
    <p class="mb-1"><a href="index.html">Home</a> · <a href="events.html">Events</a> · <a href="dining.html">Dining</a> · <a href="map.html">Map</a></p>
    <small>Data: Open-Meteo, TheMealDB, OpenStreetMap · © 2026 CampusHub</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
