<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusHub | Map</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet (free map library) CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="map">
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- ===== HEADER / NAVIGATION ===== -->
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-campus">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">CampusHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
            <li class="nav-item"><a class="nav-link" href="dining.html">Dining</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="map.html">Map</a></li>
          </ul>
          <button id="themeToggle" class="btn btn-outline-light btn-sm ms-md-3 mt-2 mt-md-0">Dark mode</button>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="container my-4">
    <h1>Campus Map</h1>

    <!-- ===== CATEGORY BUTTONS ===== -->
    <div class="mb-3" role="group" aria-label="Filter map locations">
      <button class="btn btn-sm btn-dark map-filter" data-cat="all">All</button>
      <button class="btn btn-sm btn-outline-dark map-filter" data-cat="Dining">Dining</button>
      <button class="btn btn-sm btn-outline-dark map-filter" data-cat="Study">Study spots</button>
      <button class="btn btn-sm btn-outline-dark map-filter" data-cat="Events">Event venues</button>
    </div>

    <div class="row g-3">
      <!-- ===== LOCATION LIST (built by JavaScript) ===== -->
      <aside class="col-md-4">
        <ul id="locationList" class="list-group"></ul>
      </aside>
      <!-- ===== MAP (Leaflet + OpenStreetMap API) ===== -->
      <section class="col-md-8">
        <div id="map" role="region" aria-label="Interactive campus map"></div>
      </section>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-campus text-white text-center py-3 mt-4">
    <p class="mb-1"><a href="index.html">Home</a> · <a href="events.html">Events</a> · <a href="dining.html">Dining</a> · <a href="map.html">Map</a></p>
    <small>Data: Open-Meteo, TheMealDB, OpenStreetMap · © 2026 CampusHub</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
